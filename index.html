<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="사이버펑크 2077 (2.0 + 팬텀 리버티) 공략: 육성, 빌드, 엔딩 분기, 신화 무기·타로·픽서 체크리스트">
  <meta name="theme-color" content="#0b0c10">
  <title>나이트 시티 공략집 — 사이버펑크 2077</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">NC</span>
        <div class="brand__text">
          <strong class="brand__title">나이트 시티 공략집</strong>
          <span class="brand__sub">CYBERPUNK 2077 · <span id="guideVersion"></span></span>
        </div>
      </div>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" class="search__input" type="search" placeholder="무기명, 퀘스트명, 구역, 키워드 검색" autocomplete="off" aria-label="공략 검색">
        <kbd class="search__kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="overall" aria-live="polite">
        <div class="overall__head">
          <span>전체 달성률</span>
          <span class="overall__count"><b id="overallDone">0</b> / <span id="overallTotal">0</span></span>
        </div>
        <div class="bar"><div id="overallBar" class="bar__fill"></div></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="카테고리">
      <nav class="sidenav" id="sideNav" role="tablist" aria-orientation="vertical"></nav>
      <section class="group-progress" aria-label="카테고리별 달성률">
        <h2 class="group-progress__title">체크리스트 진행도</h2>
        <ul id="groupProgress" class="group-progress__list"></ul>
        <button id="resetBtn" class="btn btn--ghost btn--sm" type="button">체크 기록 초기화</button>
      </section>
    </aside>

    <main id="main" class="content" tabindex="-1">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="빠른 필터">
          <button class="chip is-active" data-filter="all" type="button">전체</button>
          <button class="chip" data-filter="todo" type="button">미완료만 보기</button>
          <button class="chip chip--red" data-filter="missable" type="button">놓치면 끝</button>
          <button class="chip" data-filter="done" type="button">완료됨</button>
        </div>
        <label class="toggle">
          <input id="spoilerAll" type="checkbox">
          <span class="toggle__track" aria-hidden="true"></span>
          <span>스포일러 모두 보기</span>
        </label>
      </div>

      <!-- 모바일에서 보이는 현재 탭 진행도 -->
      <div id="mobileGroupProgress" class="mobile-progress"></div>

      <div id="tabContent" class="tab-content" role="tabpanel"></div>
      <p id="emptyState" class="empty" hidden></p>

      <footer class="footnote">
        팬 제작 비공식 공략입니다. 패치 버전에 따라 세부 위치·수치가 달라질 수 있습니다. 체크 기록은 이 브라우저에만 저장됩니다.
      </footer>
    </main>
  </div>

  <nav class="bottomnav" id="bottomNav" role="tablist" aria-label="카테고리"></nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
